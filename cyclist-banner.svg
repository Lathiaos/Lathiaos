<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Banner Gradient -->
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* --- Text Rotation Loop (3 Keywords) --- */
    .banner-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 22px;
      fill: #38bdf8;
      text-anchor: middle;
      dominant-baseline: central;
      opacity: 0;
      animation: cycleText 9s infinite ease-in-out;
      letter-spacing: 1px;
    }

    .text-1 { animation-delay: 0s; }
    .text-2 { animation-delay: 3s; }
    .text-3 { animation-delay: 6s; }

    @keyframes cycleText {
      0% { opacity: 0; transform: translateY(10px); }
      8% { opacity: 1; transform: translateY(0px); }
      30% { opacity: 1; transform: translateY(0px); }
      38% { opacity: 0; transform: translateY(-10px); }
      100% { opacity: 0; }
    }

    /* --- Wheels Rotating --- */
    .wheel-spin {
      transform-origin: center;
      animation: spin 0.5s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* --- Pedaling Motion --- */
    .pedal-crank {
      transform-origin: 220px 240px;
      animation: spin 0.5s linear infinite;
    }

    .leg-left {
      transform-origin: 205px 190px;
      animation: legMoveLeft 0.5s linear infinite;
    }

    .leg-right {
      transform-origin: 205px 190px;
      animation: legMoveRight 0.5s linear infinite;
    }

    @keyframes legMoveLeft {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(20deg); }
      50% { transform: rotate(0deg); }
      75% { transform: rotate(-20deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes legMoveRight {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(-20deg); }
      50% { transform: rotate(0deg); }
      75% { transform: rotate(20deg); }
      100% { transform: rotate(0deg); }
    }

    /* --- Road & Motion Lines --- */
    .road-line {
      stroke-dasharray: 40 30;
      animation: moveRoad 0.6s linear infinite;
    }

    @keyframes moveRoad {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -70; }
    }

    .speed-line {
      stroke-dasharray: 60 100;
      animation: moveSpeed 0.4s linear infinite;
    }

    @keyframes moveSpeed {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: -160; }
    }

    /* --- Cyclist Bounce --- */
    .cyclist-group {
      animation: bikeBounce 0.25s ease-in-out infinite alternate;
    }

    @keyframes bikeBounce {
      from { transform: translateY(0px); }
      to { transform: translateY(-2px); }
    }

    /* --- Banner Wave Animation --- */
    .banner-group {
      animation: bannerWave 1s ease-in-out infinite alternate;
      transform-origin: 430px 180px;
    }

    @keyframes bannerWave {
      0% { transform: rotate(0deg) translateY(0px); }
      100% { transform: rotate(1.5deg) translateY(3px); }
    }

    /* --- Connecting Rope Waver --- */
    .rope {
      animation: ropeWave 0.5s ease-in-out infinite alternate;
    }
    @keyframes ropeWave {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 4; }
    }
  </style>

  <!-- Background Card -->
  <rect width="900" height="320" rx="12" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />

  <!-- Speed Lines / Wind Effect -->
  <line x1="50" y1="60" x2="850" y2="60" stroke="#38bdf8" stroke-opacity="0.15" stroke-width="2" class="speed-line" />
  <line x1="100" y1="90" x2="800" y2="90" stroke="#38bdf8" stroke-opacity="0.1" stroke-width="1.5" class="speed-line" />
  <line x1="30" y1="120" x2="870" y2="120" stroke="#f43f5e" stroke-opacity="0.15" stroke-width="2" class="speed-line" />

  <!-- Road Line -->
  <line x1="20" y1="280" x2="880" y2="280" stroke="#334155" stroke-width="4" />
  <line x1="20" y1="280" x2="880" y2="280" stroke="#0ea5e9" stroke-width="3" class="road-line" filter="url(#neonGlow)" />

  <!-- Towing Ropes -->
  <path d="M 200 180 L 430 150" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 3" class="rope" />
  <path d="M 200 180 L 430 250" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 3" class="rope" />

  <!-- BANNER GROUP -->
  <g class="banner-group">
    <rect x="430" y="150" width="380" height="100" rx="8" fill="url(#bannerGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#neonGlow)" />
    
    <!-- Banner Attachment Details -->
    <path d="M 430 150 L 440 150 L 430 160 Z" fill="#38bdf8" />
    <path d="M 430 250 L 440 250 L 430 240 Z" fill="#38bdf8" />
    <circle cx="430" cy="150" r="3" fill="#38bdf8" />
    <circle cx="430" cy="250" r="3" fill="#38bdf8" />

    <!-- Animated Keywords -->
    <g transform="translate(620, 200)">
      <text class="banner-text text-1">INFRASTRUCTURE</text>
      <text class="banner-text text-2">RÉSEAU</text>
      <text class="banner-text text-3">CYBERSÉCURITÉ</text>
    </g>
  </g>

  <!-- CYCLIST GROUP -->
  <g class="cyclist-group">
    <!-- Back Leg (Darker shade) -->
    <g class="leg-left">
      <path d="M 205 190 L 185 220 L 220 255" stroke="#0369a1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- Back Wheel -->
    <g transform="translate(120, 240)">
      <circle cx="0" cy="0" r="38" fill="none" stroke="#1e293b" stroke-width="6" />
      <circle cx="0" cy="0" r="34" fill="none" stroke="#0284c7" stroke-width="2" filter="url(#neonGlow)" />
      <g class="wheel-spin">
        <line x1="-34" y1="0" x2="34" y2="0" stroke="#38bdf8" stroke-width="1.5" />
        <line x1="0" y1="-34" x2="0" y2="34" stroke="#38bdf8" stroke-width="1.5" />
        <line x1="-24" y1="-24" x2="24" y2="24" stroke="#38bdf8" stroke-width="1.5" />
        <line x1="-24" y1="24" x2="24" y2="-24" stroke="#38bdf8" stroke-width="1.5" />
      </g>
    </g>

    <!-- Front Wheel -->
    <g transform="translate(290, 240)">
      <circle cx="0" cy="0" r="38" fill="none" stroke="#1e293b" stroke-width="6" />
      <circle cx="0" cy="0" r="34" fill="none" stroke="#0284c7" stroke-width="2" filter="url(#neonGlow)" />
      <g class="wheel-spin">
        <line x1="-34" y1="0" x2="34" y2="0" stroke="#38bdf8" stroke-width="1.5" />
        <line x1="0" y1="-34" x2="0" y2="34" stroke="#38bdf8" stroke-width="1.5" />
        <line x1="-24" y1="-24" x2="24" y2="24" stroke="#38bdf8" stroke-width="1.5" />
        <line x1="-24" y1="24" x2="24" y2="-24" stroke="#38bdf8" stroke-width="1.5" />
      </g>
    </g>

    <!-- Frame Structure -->
    <path d="M 120 240 L 170 240 L 205 190 L 145 190 Z" fill="none" stroke="#f43f5e" stroke-width="4.5" stroke-linejoin="round" filter="url(#neonGlow)" />
    <path d="M 170 240 L 220 240 L 275 175 L 260 175 Z" fill="none" stroke="#f43f5e" stroke-width="4.5" stroke-linejoin="round" />
    <path d="M 275 175 L 290 240" stroke="#cbd5e1" stroke-width="3" /> <!-- Front Fork -->
    <path d="M 255 170 L 280 170" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" /> <!-- Handlebars -->
    <path d="M 195 185 L 215 185" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" /> <!-- Saddle Base -->

    <!-- Pedal Crankset -->
    <g class="pedal-crank">
      <line x1="220" y1="240" x2="220" y2="255" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />
      <circle cx="220" cy="240" r="7" fill="#475569" />
    </g>

    <!-- Torso & Arms -->
    <path d="M 170 180 L 210 175 L 265 177" stroke="#0ea5e9" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 210 175 L 273 173" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" fill="none" /> <!-- Arm -->

    <!-- Front Leg -->
    <g class="leg-right">
      <path d="M 205 190 L 225 215 L 220 240" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- Head & Helmet -->
    <circle cx="198" cy="145" r="11" fill="#fbcfe8" />
    <path d="M 185 145 C 185 130, 213 130, 215 145 Z" fill="#f43f5e" />
    <path d="M 203 143 L 217 145 L 211 150 Z" fill="#1e293b" />
  </g>
</svg>