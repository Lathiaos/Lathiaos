<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <style>
      @keyframes pedal {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes leg-left {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-16px) rotate(-14deg); }
      }
      @keyframes leg-right {
        0%, 100% { transform: translateY(-16px) rotate(-14deg); }
        50% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes scenery-move {
        0% { transform: translateX(0); }
        100% { transform: translateX(-200px); }
      }
      @keyframes road-move {
        0% { transform: translateX(0); }
        100% { transform: translateX(-120px); }
      }
      @keyframes wave-banner {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-4px) rotate(-1deg); }
      }
      @keyframes text-switch-1 {
        0%, 30% { opacity: 1; transform: translateY(0); }
        33%, 97% { opacity: 0; transform: translateY(10px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes text-switch-2 {
        0%, 30% { opacity: 0; transform: translateY(-10px); }
        33%, 63% { opacity: 1; transform: translateY(0); }
        66%, 100% { opacity: 0; transform: translateY(10px); }
      }
      @keyframes text-switch-3 {
        0%, 63% { opacity: 0; transform: translateY(-10px); }
        66%, 97% { opacity: 1; transform: translateY(0); }
        100% { opacity: 0; transform: translateY(-10px); }
      }

      .wheel { transform-origin: center; animation: pedal 0.65s linear infinite; }
      .leg-l { transform-origin: 180px 170px; animation: leg-left 0.65s linear infinite; }
      .leg-r { transform-origin: 180px 170px; animation: leg-right 0.65s linear infinite; }
      .scenery { animation: scenery-move 3s linear infinite; }
      .road-line { animation: road-move 0.35s linear infinite; }
      .banner { transform-origin: 320px 110px; animation: wave-banner 1.8s ease-in-out infinite; }
      
      .txt-1 { animation: text-switch-1 9s infinite; font-family: 'Segoe UI', Roboto, sans-serif; font-weight: bold; fill: #0969da; }
      .txt-2 { animation: text-switch-2 9s infinite; font-family: 'Segoe UI', Roboto, sans-serif; font-weight: bold; fill: #1f883d; }
      .txt-3 { animation: text-switch-3 9s infinite; font-family: 'Segoe UI', Roboto, sans-serif; font-weight: bold; fill: #cf222e; }
    </style>

    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="60%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#1c2129"/>
    </linearGradient>

    <linearGradient id="banner-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f6f8fa"/>
    </linearGradient>
  </defs>

  <!-- Arrière-plan -->
  <rect width="800" height="300" rx="12" fill="url(#bg-grad)"/>

  <!-- Décor défilant (Grands Arbres) -->
  <g class="scenery">
    <g transform="translate(80, 80)">
      <polygon points="0,70 -35,130 35,130" fill="#1f883d" opacity="0.5"/>
      <polygon points="0,40 -25,90 25,90" fill="#2ea043" opacity="0.7"/>
      <polygon points="0,15 -18,50 18,50" fill="#3fb950" opacity="0.8"/>
      <rect x="-5" y="130" width="10" height="40" fill="#8b949e"/>
    </g>
    <g transform="translate(280, 60)">
      <polygon points="0,80 -40,150 40,150" fill="#1a7f37" opacity="0.5"/>
      <polygon points="0,45 -30,100 30,100" fill="#2ea043" opacity="0.7"/>
      <polygon points="0,20 -20,60 20,60" fill="#3fb950" opacity="0.8"/>
      <rect x="-6" y="150" width="12" height="40" fill="#8b949e"/>
    </g>
    <g transform="translate(480, 75)">
      <polygon points="0,70 -35,130 35,130" fill="#1f883d" opacity="0.5"/>
      <polygon points="0,40 -25,90 25,90" fill="#2ea043" opacity="0.7"/>
      <polygon points="0,15 -18,50 18,50" fill="#3fb950" opacity="0.8"/>
      <rect x="-5" y="130" width="10" height="40" fill="#8b949e"/>
    </g>
    <g transform="translate(680, 65)">
      <polygon points="0,80 -40,150 40,150" fill="#1a7f37" opacity="0.5"/>
      <polygon points="0,45 -30,100 30,100" fill="#2ea043" opacity="0.7"/>
      <polygon points="0,20 -20,60 20,60" fill="#3fb950" opacity="0.8"/>
      <rect x="-6" y="150" width="12" height="40" fill="#8b949e"/>
    </g>
    <g transform="translate(880, 75)">
      <polygon points="0,70 -35,130 35,130" fill="#1f883d" opacity="0.5"/>
      <polygon points="0,40 -25,90 25,90" fill="#2ea043" opacity="0.7"/>
      <rect x="-5" y="130" width="10" height="40" fill="#8b949e"/>
    </g>
  </g>

  <!-- Route (Pose à Y=260) -->
  <line x1="0" y1="260" x2="800" y2="260" stroke="#484f58" stroke-width="6"/>
  <g class="road-line">
    <line x1="-50" y1="272" x2="950" y2="272" stroke="#30363d" stroke-width="4" stroke-dasharray="35,25"/>
  </g>

  <!-- Banderole (Attachée derrière le cycliste) -->
  <g class="banner">
    <line x1="435" y1="205" x2="330" y2="105" stroke="#8b949e" stroke-width="2" stroke-dasharray="4,2"/>
    <line x1="435" y1="205" x2="330" y2="185" stroke="#8b949e" stroke-width="2" stroke-dasharray="4,2"/>

    <path d="M 20 95 L 330 95 Q 345 140 330 185 L 20 185 Q 5 140 20 95 Z" fill="url(#banner-grad)" filter="drop-shadow(-2px 4px 6px rgba(0,0,0,0.4))"/>
    <path d="M 20 95 L 5 95 L 15 140 L 5 185 L 20 185 Z" fill="#d0d7de"/>

    <g transform="translate(175, 148)">
      <text class="txt-1" font-size="24" text-anchor="middle">INFRASTRUCTURE</text>
      <text class="txt-2" font-size="24" text-anchor="middle">RÉSEAU</text>
      <text class="txt-3" font-size="24" text-anchor="middle">CYBERSÉCURITÉ</text>
    </g>
  </g>

  <!-- Cycliste & Vélo Grand Format (Agrandis & Roues directement sur la route à Y=260) -->
  <g transform="translate(320, 10)">
    <!-- Roue arrière (Centre Y=220, Rayon=40 -> bas du pneu à Y=260) -->
    <g transform="translate(110, 220)">
      <circle r="40" fill="none" stroke="#e6edf3" stroke-width="5"/>
      <circle r="36" fill="none" stroke="#388bfd" stroke-width="2"/>
      <g class="wheel">
        <line x1="-38" y1="0" x2="38" y2="0" stroke="#8b949e" stroke-width="2"/>
        <line x1="0" y1="-38" x2="0" y2="38" stroke="#8b949e" stroke-width="2"/>
        <line x1="-27" y1="-27" x2="27" y2="27" stroke="#8b949e" stroke-width="2"/>
        <line x1="-27" y1="27" x2="27" y2="-27" stroke="#8b949e" stroke-width="2"/>
      </g>
    </g>

    <!-- Roue avant (Centre Y=220, Rayon=40 -> bas du pneu à Y=260) -->
    <g transform="translate(260, 220)">
      <circle r="40" fill="none" stroke="#e6edf3" stroke-width="5"/>
      <circle r="36" fill="none" stroke="#388bfd" stroke-width="2"/>
      <g class="wheel">
        <line x1="-38" y1="0" x2="38" y2="0" stroke="#8b949e" stroke-width="2"/>
        <line x1="0" y1="-38" x2="0" y2="38" stroke="#8b949e" stroke-width="2"/>
        <line x1="-27" y1="-27" x2="27" y2="27" stroke="#8b949e" stroke-width="2"/>
        <line x1="-27" y1="27" x2="27" y2="-27" stroke="#8b949e" stroke-width="2"/>
      </g>
    </g>

    <!-- Cadre du vélo -->
    <path d="M 110 220 L 165 220 L 210 155 L 135 155 Z" fill="none" stroke="#1f6beb" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 165 220 L 250 160 L 260 220" fill="none" stroke="#1f6beb" stroke-width="6" stroke-linejoin="round"/>
    <!-- Guidon & Selle -->
    <path d="M 245 155 L 258 138 L 272 140" fill="none" stroke="#f0f6fc" stroke-width="4" stroke-linecap="round"/>
    <path d="M 125 150 L 148 150" stroke="#f0f6fc" stroke-width="6" stroke-linecap="round"/>

    <!-- Jambe gauche (arrière) -->
    <path class="leg-l" d="M 175 145 L 160 185 L 165 220" fill="none" stroke="#388bfd" stroke-width="8" stroke-linecap="round"/>

    <!-- Cycliste -->
    <!-- Tronc -->
    <path d="M 170 145 L 220 110" stroke="#f0f6fc" stroke-width="15" stroke-linecap="round"/>
    <!-- Maillot Orange/Rouge Vif -->
    <path d="M 170 145 L 220 110" stroke="#f78166" stroke-width="12" stroke-linecap="round"/>
    <!-- Bras -->
    <path d="M 215 118 L 252 142" stroke="#f0f6fc" stroke-width="6" stroke-linecap="round"/>
    <!-- Tête & Casque -->
    <circle cx="232" cy="90" r="13" fill="#f0f6fc"/>
    <path d="M 218 87 C 218 72, 246 72, 246 87 Z" fill="#238636"/>

    <!-- Jambe droite (avant) -->
    <path class="leg-r" d="M 175 145 L 195 180 L 165 220" fill="none" stroke="#58a6ff" stroke-width="9" stroke-linecap="round"/>
  </g>
</svg>
